[package]
name = "esoccer-battle"
version = "5.0.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
cpal = "0.15"
rodio = "0.20"
dirs = "5"

[build-dependencies]
tauri-build = { version = "2", features = [] }
