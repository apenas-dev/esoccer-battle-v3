[package]
name = "esoccer-battle"
version = "0.1.0"
description = "E-Soccer Battle V3"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
anyhow = "1.0.80"
chrono = "0.4.38"
cpal = "0.15.2"
directories = "5.0.1"
reqwest = "0.11.24"
rodio = "0.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strsim = "0.11"
strum = "0.26"
strum_macros = "0.26"
sysinfo = "0.30.12"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1.37.0", features = ["full"] }
whisper-rs = { git = "https://github.com/tazz4843/whisper-rs", rev = "f1030ef" }
bincode = "1.3.3"
tracing = "0.1"

[features]
custom-protocol = ["tauri/custom-protocol"]
